name: Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-compatibility:
    name: Swift compatibility
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run QuotaBackend tests
        working-directory: QuotaBackend
        run: swift test

      - name: Run Claude proxy regression
        run: ./scripts/run_claude_proxy_regression.sh

      - name: Run Claude Science auth proxy regression
        run: ./scripts/run_science_auth_proxy_regression.sh

      - name: Run CPA gateway regression
        run: ./scripts/run_cliproxy_updater_regression.sh

  windows-foundation:
    name: Windows foundation
    runs-on: windows-2022
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.422
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore AIUsage.Windows.sln --locked-mode -p:Platform=x64

      - name: Build
        run: dotnet build AIUsage.Windows.sln --configuration Release --no-restore -p:Platform=x64

      - name: Test
        run: dotnet test AIUsage.Windows.sln --configuration Release --no-build -p:Platform=x64
