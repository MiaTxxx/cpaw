name: Validation

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-compatibility:
    name: Swift compatibility
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.422

      - name: Validate committed golden fixtures
        shell: bash
        run: |
          dotnet restore eng/AIUsage.FixtureTool/AIUsage.FixtureTool.csproj --locked-mode
          dotnet run --project eng/AIUsage.FixtureTool/AIUsage.FixtureTool.csproj \
            --configuration Release --no-restore -- \
            validate QuotaBackend/Tests/QuotaBackendTests/Fixtures

      - name: Run QuotaBackend tests
        working-directory: QuotaBackend
        run: swift test

      - name: Export Swift contract golden fixtures
        env:
          AIUSAGE_GOLDEN_OUTPUT: ${{ runner.temp }}/swift-goldens
        run: swift test --package-path QuotaBackend --filter ContractsGoldenExporterTests.testExportContractsV1Goldens

      - name: Validate exported golden fixtures
        shell: bash
        run: |
          dotnet run --project eng/AIUsage.FixtureTool/AIUsage.FixtureTool.csproj \
            --configuration Release --no-restore -- \
            validate "$RUNNER_TEMP/swift-goldens"

      - name: Upload Swift golden fixtures
        uses: actions/upload-artifact@v6
        with:
          name: swift-contract-goldens
          path: ${{ runner.temp }}/swift-goldens
          if-no-files-found: error

      - name: Verify committed fixtures match Swift output
        shell: bash
        run: diff -ru QuotaBackend/Tests/QuotaBackendTests/Fixtures/v1 "$RUNNER_TEMP/swift-goldens/v1"

      - name: Run Claude proxy regression
        run: bash ./scripts/run_claude_proxy_regression.sh

      - name: Run Claude Science auth proxy regression
        run: bash ./scripts/run_science_auth_proxy_regression.sh

      - name: Run CPA gateway regression
        run: bash ./scripts/run_cliproxy_updater_regression.sh

  windows-foundation:
    name: Windows foundation
    runs-on: windows-2022
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.422
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore AIUsage.Windows.sln --locked-mode -p:Platform=x64

      - name: Build
        run: dotnet build AIUsage.Windows.sln --configuration Release --no-restore -p:Platform=x64

      - name: Validate committed golden fixtures
        run: dotnet run --project eng/AIUsage.FixtureTool/AIUsage.FixtureTool.csproj --configuration Release --no-restore -- validate QuotaBackend/Tests/QuotaBackendTests/Fixtures

      - name: Test
        run: dotnet test AIUsage.Windows.sln --configuration Release --no-build -p:Platform=x64
